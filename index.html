    let r=await db.from('courier_state').upsert(op.d);

}

async function optimize(){
  const P=active().filter(s=>s.lat!=null);geo=null;
  if(!P.length){order=[];return render()}
  const pts=me?[me,...P]:P;
  try{
    const j=await(await fetch('https://router.project-osrm.org/trip/v1/driving/'+pts.map(p=>p.lng+','+p.lat).join(';')+'?source=first&roundtrip=false&overview=full&geometries=geojson',tmo(7000))).json();
    if(j.code!=='Ok')throw 0;const off=me?1:0;
    order=P.map((s,i)=>({s,k:j.waypoints[i+off].waypoint_index})).sort((a,b)=>a.k-b.k).map(o=>o.s.id);geo=j.trips[0].geometry.coordinates;legDur=(me?[]:[0]).concat(j.trips[0].legs.map(l=>l.duration));
  }catch(e){let cur=me||P[0],left=[...P];order=[];while(left.length){left.sort((a,b)=>hav(cur,a)-hav(cur,b));cur=left.shift();order.push(cur.id)}legDur=[];let pv=me||P[0];order.forEach(id=>{const t=S.find(x=>x.id===id);legDur.push(hav(pv,t)*1.35/22*3600);pv=t})}
  render(true);
}
function render(fit){if(PICK){if(!S.some(s=>s.id===PICK&&!s.done))PICK=null;else if(order[0]!==PICK&&order.includes(PICK))order=[PICK,...order.filter(x=>x!==PICK)]}
  mk.forEach(m=>m.remove());mk=[];

  if(ready){
    P.forEach((s,i)=>{const e=document.createElement('div');e.className='pin'+(i?'':' f');e.textContent=i+1;e.onclick=()=>pickStop(s.id);mk.push(new maplibregl.Marker({element:e}).setLngLat([s.lng,s.lat]).addTo(map))});
    const pts=geo||[...(me?[[me.lng,me.lat]]:[]),...P.map(s=>[s.lng,s.lat])];setLine('trip',pts);
    if(fit&&pts.length>1&&!(follow&&work)&&!NV.on)map.fitBounds(pts.reduce((b,c)=>b.extend(c),new maplibregl.LngLatBounds(pts[0],pts[0])),{padding:{top:90,bottom:Math.round(innerHeight*.4),left:40,right:40},maxZoom:16,duration:600});

function initDrag(){
  const sh=$('sheet'),pk=$('peek'),dt=$('det'),off=()=>dt.offsetHeight,set=y=>sh.style.setProperty('--y',y+'px');
  sheetSet=v=>{open=v;if(v)$('plist').classList.remove('on');set(open?0:off())};sh.classList.add('nt');set(open?0:off());
  requestAnimationFrame(()=>requestAnimationFrame(()=>sh.classList.remove('nt')));
  let y0=null,base=0,t0=0,drag=false,ly=0,ds=null,sc=false;
  sh.onpointerdown=e=>{if(e.target.closest&&e.target.closest('input,textarea,select'))return;y0=e.clientY;base=open?0:off();t0=performance.now();drag=false;ly=base;ds=dt.contains(e.target)&&open?dt.scrollTop:null;sc=false};
  sh.onpointermove=e=>{
    if(y0==null)return;const dy=e.clientY-y0;
    if(!drag&&!sc&&Math.abs(dy)>6){const mx=dt.scrollHeight-dt.clientHeight;if(ds!=null&&mx>2&&ds-dy>0&&ds-dy<mx)sc=true;else{drag=true;sh.setPointerCapture(e.pointerId);sh.classList.add('nt')}}
    if(sc){dt.scrollTop=Math.max(0,Math.min(dt.scrollHeight-dt.clientHeight,ds-dy));return}
    if(!drag)return;
    const o=off();let y=base+dy;y=Math.max(0,Math.min(o,y));ly=y;set(y);
  };
  const end=e=>{
    if(y0==null)return;if(sc){sc=false;y0=null;ds=null;return}const v=(e.clientY-y0)/Math.max(1,performance.now()-t0),o=off();y0=null;sh.classList.remove('nt');
    if(!drag){if(e.target.closest&&e.target.closest('a,button,input,textarea,select,label'))return;if(!pk.contains(e.target))return;open=!open}
    else open=v<-.3?true:v>.3?false:ly<o/2;
    if(open)$('plist').classList.remove('on');set(open?0:o);
  };
  sh.onpointerup=end;sh.onpointercancel=end;
}

async function deliver(n){
  if(!n)return;
  const far=()=>!me||hav(me,n)*1000>NEAR;
  const farMsg=()=>me?'إنت بعيد '+Math.round(hav(me,n)*1000)+' م عن العميل. قرّب لحد '+NEAR+' م وبعدين سجّل التسليم.':'مش قادر أحدد موقعك. شغّل الـ GPS.';
  if(far())return toast(farMsg());
  const inv=`<h2>فاتورة الأوردر</h2><div class="inv"><div><span>العميل</span><b>${esc(n.name||'—')}</b></div><div><span>التليفون</span><b dir="ltr">${esc(n.phone||'—')}</b></div><div><span>العنوان</span><b>${esc([n.addr,n.bld&&'عمارة '+n.bld,n.apt&&'شقة '+n.apt].filter(Boolean).join('، ')||'—')}</b></div><div><span>الأوردر</span><b>${esc(n.ord||'—')}</b></div><div><span>الدفع</span><b>${n.cash?'كاش · '+money(n.amt):'فيزا'}</b></div></div>`;
  let got=null,rk=null;
  const x=await modal(inv+(n.cash?`<label class="mut" for="rcv" style="display:block;margin-top:12px">المبلغ المستلم (عدّله لو مختلف)</label><input id="rcv" inputmode="decimal" value="${n.amt!=null?esc(n.amt):''}">`:'')+`<p class="mut" style="margin-top:12px">استلمت نسخة الفاتورة من العميل؟ لازم ترجّعها للشركة.</p><div class="seg" style="margin-top:6px"><button type="button" id="rk-y">أيوه، معايا</button><button type="button" id="rk-n">لا، ماستلمتهاش</button></div><button class="ok w big" data-r="ok" id="dok" disabled style="margin-top:14px">تأكيد التسليم</button><button class="w" data-r="x" style="margin-top:8px">رجوع</button>`,()=>n.cash?$('rcv').value:'',()=>{
    const pick=v=>{rk=v;$('rk-y').classList.toggle('on',v);$('rk-n').classList.toggle('on',!v);$('dok').disabled=false};
    $('rk-y').onclick=()=>pick(true);$('rk-n').onclick=()=>pick(false);
    if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  });
  if(!x||x.r!=='ok'||rk===null)return;
  if(n.cash){got=parseFloat(String(x.v).replace(/,/g,''));if(isNaN(got)||got<0)return toast('اكتب مبلغ صحيح')}
  if(!rk&&!await ask('تنبيه: الفاتورة مهمة','الشركة محتاجة الفاتورة. اطلبها من العميل قبل ما تمشي. تسجّل التسليم من غير فاتورة؟','سجّل من غير فاتورة',true))return;
  if(far())return toast(farMsg());
  const at=new Date().toISOString();
  const{error}=await stopUpd(n.id,{done:true,done_at:at,cash_collected:n.cash,received:got,receipt_kept:rk},['receipt_kept']);
  if(error)return toast('ماتحفظش، جرّب تاني');
  Object.assign(n,{done:true,at,got,rk});if(PICK===n.id)PICK=null;wasNear=false;open=false;const cont=NV.on;if(cont)NV.hold=1;
  toast('تم تسليم '+(n.name||'العميل'),'تراجع',()=>undo(n));
  me&&(me={lat:n.lat,lng:n.lng});await optimize();if(cont){NV.hold=0;navNext()}
}

  if(!(data&&data.session)){
    if(cu&&(!data||navigator.onLine===false)){uid=cu;work=ld('togo_work',false);$('auth').style.display='none';live();load();hideSplash();setInterval(load,30000);maybeTour();return}
    $('auth').style.display='flex';hideSplash();if(pending){show(false);amsg('اتعمل الحساب. سجّل دخولك دلوقتي.')}return}
  const u=data.user||data.session.user||{};uid=u.id;sv('togo_uid',uid);$('auth').style.display='none';
  if(!PF.name&&u.name){PF.name=u.name;sv('togo_profile',PF)}
  try{
    if(pending){const r0={courier_id:uid,full_name:pending.name,phone:pending.phone,updated_at:new Date().toISOString()};{const q=await db.from('courier_state').upsert(r0);if(q.error)await db.from('courier_state').upsert({courier_id:uid,phone:pending.phone,updated_at:r0.updated_at})}pending=null}
    let w=await withT(db.from('courier_state').select('working,full_name,phone,rate').eq('courier_id',uid).maybeSingle());if(w.error)w=await withT(db.from('courier_state').select('working').eq('courier_id',uid).maybeSingle());
    if(w.error)throw w.error;
    work=!Q.some(x=>x.t==='cs')?!!(w.data&&w.data.working):ld('togo_work',false);sv('togo_work',work);
    if(w.data){if(w.data.full_name)PF.name=w.data.full_name;if(w.data.phone)PF.phone=w.data.phone;if(w.data.rate!=null)PF.rate=+w.data.rate;sv('togo_profile',PF)}
  }catch(e){work=ld('togo_work',false)}
  live();load();hideSplash();setInterval(load,30000);maybeTour();
}
const normPhone=v=>{let d=String(v||'').replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/\D/g,'');if(d.startsWith('0020'))d='0'+d.slice(4);else if(d.startsWith('20')&&d.length>=12)d='0'+d.slice(2);else if(d.length===10&&d.startsWith('1'))d='0'+d;return d};
const phoneEmail=p=>p+'@togo-app.com';
const ar2en=v=>String(v||'').replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c));
const pwOf=d=>ar2en(d)+'@togo';
$('lp').oninput=()=>{$('lw').inputMode=$('lp').value.includes('@')?'text':'numeric'};
let pending=null;
const amsg=t=>{$('amsg').textContent=t};
const show=up=>{$('f-in').hidden=up;$('f-up').hidden=!up;$('atag').textContent=up?'أنشئ حسابك وابدأ شغلك.':'سجّل دخولك وابدأ شغلك.';amsg('')};
$('to-up').onclick=()=>show(true);$('to-in').onclick=()=>show(false);
async function run(btn,fn){const t=btn.textContent;btn.disabled=true;btn.textContent='ثواني...';try{await fn()}catch(e){amsg('في مشكلة في الاتصال، جرّب تاني')}btn.disabled=false;btn.textContent=t}
$('in').onclick=()=>{
  const id=$('lp').value.trim(),pw=$('lw').value;
  if(!id||!pw)return amsg('اكتب رقم التليفون وكلمة السر');
  const email=id.includes('@')?id:phoneEmail(normPhone(id));
  run($('in'),async()=>{const r=await db.auth.signIn.email({email,password:id.includes('@')?pw:pwOf(pw)});if(r.error){amsg('رقم التليفون أو كلمة السر غلط');return}amsg('');boot()});
};
$('up').onclick=()=>{
  const name=$('sn').value.trim(),ph=normPhone($('sp').value),pw=$('sw').value;
  if(!name)return amsg('اكتب اسمك');
  if(ph.length<10||ph.length>13)return amsg('رقم التليفون مش صحيح');
  if(!/^\d{6}$/.test(ar2en(pw)))return amsg('كلمة السر لازم ٦ أرقام');
  run($('up'),async()=>{const r=await db.auth.signUp.email({email:phoneEmail(ph),password:pwOf(pw),name});if(r.error){amsg(/exist|already|taken/i.test(r.error.message||'')?'الرقم ده مسجّل قبل كده. سجّل دخولك.':(r.error.message||'ماتسجّلش، جرّب تاني'));return}pending={name,phone:ph};PF={...PF,name,phone:ph};sv('togo_profile',PF);amsg('');boot()});
};
async function signOut(){if(!await ask('تسجيل الخروج',Q.length?'فيه '+Q.length+' تعديل لسه ماتزامنش، وهيتمسحوا لو خرجت. افتح النت الأول لو عايزهم يتزامنوا.':'هتحتاج تدخل بالإيميل وكلمة السر تاني.','اخرج',true))return;try{await db.auth.signOut()}catch(e){}sv('togo_uid',null);sv(QK,[]);sv(RK,[]);location.reload()}
draw();boot();
</script>
