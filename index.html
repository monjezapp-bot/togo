<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<meta name="description" content="ToGo — تطبيق للمناديب بينظّم مسار التوصيل ويحسب حسابك.">
<meta property="og:site_name" content="ToGo"><meta property="og:title" content="تطبيق ToGo"><meta property="og:description" content="تطبيق للمناديب بينظّم مسار التوصيل ويحسب حسابك."><meta property="og:image" content="logo.png">

<style>
:root{--ink:#111827;--mut:#64748b;--line:#e5e9ef;--bg:#f1f4f8;--pri:#f26a1b;--ok:#15803d;--bad:#dc2626;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body,dialog{touch-action:pan-x pan-y}html,body{height:100%;margin:0;overflow:hidden}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:pan-x pan-y;overscroll-behavior:none;font:500 16px/1.5 "Readex Pro",Tahoma,sans-serif;color:var(--ink);background:var(--bg)}
#map{position:fixed;inset:0}
button{font:inherit;font-weight:600;border:0;border-radius:var(--r);min-height:52px;padding:0 16px;background:var(--bg);color:var(--ink)}
button:active{transform:scale(.97)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.p{background:var(--pri);color:#fff}.ok{background:var(--ok);color:#fff}.bad{background:var(--bad);color:#fff}.w{width:100%}
.big{min-height:64px;font-size:20px;border-radius:18px}
.row{display:flex;gap:8px;margin-top:10px}.row>*{flex:1;min-width:0}
.mut{color:var(--mut);margin:0}
h2{margin:0;font-size:22px;line-height:1.3}
.top{position:fixed;z-index:5;inset-inline:12px;top:calc(12px + env(safe-area-inset-top));display:flex;gap:8px;align-items:center}
.rb{flex:none;width:48px;min-height:48px;height:48px;padding:0;border-radius:50%;background:#fff;box-shadow:0 4px 14px #0003;font-size:22px}
.rb.on{background:var(--pri);color:#fff}
.prog{flex:1;background:var(--ink);color:#fff;border-radius:99px;padding:8px 18px;box-shadow:0 4px 14px #0004;text-align:center}
.prog b{font-size:20px}.prog span{color:#aab4c3;font-size:13px;margin-inline-start:6px}
.bar{height:4px;border-radius:4px;background:#ffffff33;margin-top:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
#sheet{position:fixed;z-index:6;inset-inline:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;padding:0 16px;box-shadow:0 -8px 28px #0003;transform:translateY(var(--y,0));transition:transform .55s cubic-bezier(.22,1,.36,1);will-change:transform}#sheet.nt{transition:none}#peek{padding-bottom:calc(14px + env(safe-area-inset-bottom))}#peek.dr{touch-action:none}#det{max-height:52vh;overflow:auto;overscroll-behavior:contain;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.grab{height:22px;display:grid;place-items:center;touch-action:none}.grab i{width:40px;height:4px;border-radius:4px;background:#cfd6df}
.hd{display:flex;gap:12px;align-items:center}.hd>div{flex:1;min-width:0}
.num{flex:none;width:44px;height:44px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px}
.call{flex:none;width:52px;height:52px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;text-decoration:none;font-size:22px}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.fact{background:var(--bg);border-radius:12px;padding:6px 12px}.fact small{display:block;color:var(--mut);font-size:12px;line-height:1.2}.fact b{font-size:20px}
.fact.cash{background:#fff1e8;color:#b04a0b}.fact.visa{background:#e8f0fe;color:#1d4ed8}
.addr{font-size:20px;font-weight:600;margin:14px 0 0;line-height:1.5}
.link{background:none;color:var(--mut);min-height:44px;width:100%;margin-top:6px;font-size:14px}
.item{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}.item>div{flex:1;min-width:0}.item small{display:block;color:var(--mut)}
.item button{min-height:40px;font-size:14px;padding:0 12px}
.tag{font-size:12px;padding:2px 10px;border-radius:99px;background:var(--bg);color:var(--mut)}.tag.d{background:#e8f6ed;color:var(--ok)}
.pin{width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;border:3px solid #fff;display:grid;place-items:center;font-weight:700;font-size:14px;box-shadow:0 2px 8px #0005}
.pin.f{background:var(--pri);width:40px;height:40px;font-size:17px}
.me{width:20px;height:20px;border-radius:50%;background:#2563eb;border:4px solid #fff;box-shadow:0 0 0 8px #2563eb33}
#menu{position:fixed;z-index:12;inset:0;background:#0b1220aa;opacity:0;visibility:hidden;transition:opacity .35s ease,visibility 0s .4s}#menu.on{opacity:1;visibility:visible;transition:opacity .35s ease}
#menu nav{position:absolute;inset-block:0;inset-inline-start:0;width:80%;max-width:320px;background:#fff;border-radius:24px 0 0 24px;padding:calc(24px + env(safe-area-inset-top)) 16px 16px;display:flex;flex-direction:column;gap:6px;transform:translateX(100%);transition:transform .45s cubic-bezier(.22,1,.36,1)}#menu.on nav{transform:none}
#menu nav h2{margin-bottom:2px}#menu nav button{text-align:start;background:none;min-height:56px;font-size:18px}#menu nav button.on{background:#fff1e8;color:var(--pri)}
#view{position:fixed;z-index:10;inset:0;background:var(--bg);display:flex;flex-direction:column;visibility:hidden;opacity:0;transform:translateX(36px);transition:transform .5s cubic-bezier(.22,1,.36,1),opacity .35s ease,visibility 0s .5s}#view.on{visibility:visible;opacity:1;transform:none;transition:transform .5s cubic-bezier(.22,1,.36,1),opacity .35s ease}
#view header{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 12px 12px;background:#fff;border-bottom:1px solid var(--line)}
#view header h2{flex:1}#vb{padding:14px 14px 90px;overflow:auto;flex:1}
.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.day{flex:1;min-width:48px;min-height:64px;padding:4px;background:#fff;line-height:1.3;font-size:13px}.day b{display:block;font-size:18px}.day.on{background:var(--ink);color:#fff}.day.t:not(.on){color:var(--pri)}
.sum{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}.sum:first-of-type{border:0}
.owe{background:var(--ink);color:#fff;border-radius:18px;padding:20px;margin-bottom:12px}.owe small{color:#aab4c3}.owe div{font-size:38px;font-weight:700}
.fab{position:fixed;z-index:11;inset-inline-start:16px;bottom:calc(20px + env(safe-area-inset-bottom));box-shadow:0 6px 18px #0004}
dialog{margin:auto 0 0;width:100%;max-width:none;border:0;border-radius:24px 24px 0 0;padding:20px 16px calc(16px + env(safe-area-inset-bottom));font:inherit;color:var(--ink);max-height:92vh}
.cx{position:absolute;top:12px;right:12px;width:36px;height:36px;min-height:0;padding:0;border-radius:50%;display:grid;place-items:center;font-size:18px;line-height:1;background:var(--bg);color:var(--mut)}.cxh{padding-right:44px}.item .tag{flex:none}.item .sm{min-height:36px;padding:0 10px;font-size:13px;flex:none}dialog::backdrop{background:#0b1220aa}dialog h2{margin-bottom:6px}
input,textarea{width:100%;font:inherit;font-size:16px;padding:13px 14px;margin-top:8px;border:1.5px solid var(--line);border-radius:var(--r);background:#fff;color:var(--ink)}
.seg{display:flex;gap:6px}.seg button{flex:1}.seg .on{background:var(--ink);color:#fff}
label small{display:block;color:var(--mut);margin-top:10px}
.inv div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}.inv span{color:var(--mut)}.inv b{text-align:end}
#toast{position:fixed;z-index:30;inset-inline:12px;top:calc(72px + env(safe-area-inset-top));background:var(--ink);color:#fff;border-radius:var(--r);padding:8px 8px 8px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 20px #0005}
#toast[hidden]{display:none}#toast span{flex:1}#toast button{min-height:40px;background:var(--pri);color:#fff}
#auth{position:fixed;z-index:40;inset:0;background:#0f2238;color:#fff;padding:28px;display:none;flex-direction:column;justify-content:center}
#auth h1{font-size:54px;margin:0 0 4px}#auth h1 i{font-style:normal;color:var(--pri)}#auth p{color:#aab4c3;margin:0 0 14px}#amsg{color:#fca5a5;min-height:24px;margin-top:8px}
.rcpt{background:#fff1e8;color:#b04a0b;border-radius:12px;padding:8px 12px;margin:8px 0;font-size:14px}.rcpt.w2{background:#fee2e2;color:#991b1b}
body.night #sheet{background:#1f2227;color:#f5f1e6}body.night .fact{background:#2b2f36}
body.night .maplibregl-canvas{filter:invert(.92) hue-rotate(180deg) saturate(.75) brightness(.92)}
input,textarea{-webkit-user-select:text;user-select:text}img{-webkit-user-drag:none}
dialog[open]{animation:dgin .5s cubic-bezier(.22,1,.36,1)}dialog[open]::backdrop{animation:bdin .4s ease}
dialog.out{animation:dgout .3s cubic-bezier(.4,0,1,1) forwards}dialog.out::backdrop{animation:bdout .3s ease forwards}
@keyframes dgin{from{transform:translateY(100%)}}@keyframes dgout{to{transform:translateY(100%)}}@keyframes bdin{from{opacity:0}}@keyframes bdout{to{opacity:0}}
#toast{animation:tin .4s cubic-bezier(.22,1,.36,1)}@keyframes tin{from{transform:translateY(-14px);opacity:0}}
#splash{position:fixed;inset:0;z-index:50;background:#0f2238;display:grid;place-items:center;transition:opacity .5s ease,visibility 0s .5s}#splash.off{opacity:0;visibility:hidden}
#splash img,#auth img{width:min(60vw,230px);height:auto;animation:pop .7s cubic-bezier(.22,1,.36,1)}#auth img{margin:0 auto 18px}#splash img{width:min(70vw,300px)}@keyframes pop{from{transform:scale(.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
#loc{position:absolute;inset-inline-start:16px;top:-64px}
.spin{animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(-360deg)}}
.prog{cursor:pointer}
#plist{position:fixed;z-index:5;inset-inline:12px;top:calc(70px + env(safe-area-inset-top));background:#fff;border-radius:20px;box-shadow:0 10px 30px #0004;max-height:55vh;overflow:auto;padding:4px 14px;transform-origin:top;transform:scaleY(.9) translateY(-8px);opacity:0;visibility:hidden;transition:transform .4s cubic-bezier(.22,1,.36,1),opacity .25s ease,visibility 0s .4s}
#plist.on{transform:none;opacity:1;visibility:visible;transition:transform .4s cubic-bezier(.22,1,.36,1),opacity .25s ease}
.pi{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.pi:first-child{border:0}.pi>div:nth-child(2){flex:1;min-width:0}.pi small{display:block;color:var(--mut);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pi .num{width:34px;height:34px;font-size:15px;background:var(--ink)}.pi:first-child .num{background:var(--pri)}.pi .eta{text-align:end;flex:none}.pi .eta b{font-size:16px}
#auth{overflow:auto;text-align:center;justify-content:flex-start}#auth .ain{margin:auto 0;width:100%}#auth img{display:block;margin:0 auto 14px}#auth p{text-align:center;margin:0 0 18px}
#auth .alt{background:none;color:#aab4c3;min-height:48px;width:100%;margin-top:8px;font-size:15px}#auth .alt b{color:var(--pri)}
.pi{gap:8px;padding:8px 0}.pi .num{width:30px;height:30px;font-size:14px}
.pi .nm,.item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.pi .mn{flex:none;font-weight:700;font-size:15px}.pi .mn.g{color:var(--mut);font-weight:500;font-size:13px}
.ib{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;text-decoration:none}.ib.c{background:var(--ok);color:#fff}.ib.w{background:#e8f6ed;color:var(--ok)}.ib.l{background:#fff1e8;color:var(--pri)}
.item[data-o]{cursor:pointer}.item[data-o]:active{background:var(--bg)}
.inv b.ph{display:flex;align-items:center;gap:8px}
</style>
</head>
<body>
<div id="map"></div>
<div id="splash"><img src="logo.png" alt="ToGo"></div>
<div class="top"><button class="rb" id="mn" aria-label="القائمة">☰</button><div class="prog" id="prog"></div><button class="rb" id="rf" aria-label="تحديث">↻</button></div>
<div id="plist"></div>
<div id="sheet"><button class="rb on" id="loc" aria-label="موقعي">◎</button><div id="sc"></div></div>
<div id="menu"><nav id="nav"></nav></div>
<div id="view"><header><button class="rb" id="vx" aria-label="رجوع" style="box-shadow:none;background:var(--bg)">›</button><h2 id="vt"></h2></header><div id="vb"></div></div>
<div id="toast" hidden></div>
<dialog id="dg"></dialog>
<div id="auth"><div class="ain">
  <img src="logo.png" alt="ToGo">
  <p id="atag">سجّل دخولك وابدأ شغلك.</p>
  <div id="f-in">
    <input id="lp" type="tel" inputmode="tel" placeholder="رقم التليفون" autocomplete="username">
    <input id="lw" type="password" inputmode="numeric" placeholder="كلمة السر" autocomplete="current-password">
    <button class="p w big" id="in" style="margin-top:14px">دخول</button>
    <button class="alt" id="to-up">معندكش حساب؟ <b>سجّل حساب جديد</b></button>
  </div>
  <div id="f-up" hidden>
    <input id="sn" placeholder="الاسم" autocomplete="name">
    <input id="sp" type="tel" inputmode="tel" placeholder="رقم التليفون" autocomplete="tel">
    <input id="sw" type="password" inputmode="numeric" maxlength="6" placeholder="كلمة السر (٦ أرقام)" autocomplete="new-password">
    <button class="p w big" id="up" style="margin-top:14px">إنشاء الحساب</button>
    <button class="alt" id="to-in">عندك حساب؟ <b>سجّل دخولك</b></button>
  </div>
  <div id="amsg"></div>
  <button class="w" id="ia" hidden style="margin-top:16px;background:#ffffff22;color:#fff">ثبّت التطبيق على موبايلك</button>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script type="module">
import {createClient} from 'https://esm.sh/@neondatabase/neon-js';
const NEAR=1000,DWELL=240;
const db=createClient({
  auth:{url:'https://ep-noisy-feather-b72o2ma5.neonauth.c-13.us-east-1.aws.neon.tech/neondb/auth'},
  dataApi:{url:'https://ep-noisy-feather-b72o2ma5.apirest.c-13.us-east-1.aws.neon.tech/neondb/rest/v1'}
});
const $=id=>document.getElementById(id);
let inst=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();inst=e});
const isApp=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
if(!isApp)$('ia').hidden=false;
$('ia').onclick=async()=>{if(inst){inst.prompt();inst=null;return}await modal('<h2>تثبيت التطبيق</h2><p class="mut">افتح قائمة المتصفح ⋮ وبعدين اختار «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».</p><p class="mut">على الآيفون: دوس زرار المشاركة وبعدين «إضافة إلى الشاشة الرئيسية».</p><button class="p w" data-r="ok" style="margin-top:12px">تمام</button>')};
addEventListener('appinstalled',()=>{$('ia').hidden=true;inst=null});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
['gesturestart','gesturechange','gestureend'].forEach(t=>addEventListener(t,e=>e.preventDefault()));
const theme=()=>{const h=new Date().getHours();document.body.classList.toggle('night',h>=18||h<6)};theme();setInterval(theme,60000);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hav=(a,b)=>{const d=Math.PI/180,x=Math.sin((b.lat-a.lat)*d/2)**2+Math.cos(a.lat*d)*Math.cos(b.lat*d)*Math.sin((b.lng-a.lng)*d/2)**2;return 12742*Math.asin(Math.sqrt(x))};
const waNum=p=>{const d=String(p||'').replace(/[^\d+]/g,'');return d.startsWith('+')?d.slice(1):d.startsWith('00')?d.slice(2):d.startsWith('0')?'20'+d.slice(1):d};
const money=n=>(+n||0).toLocaleString('en')+' ج.م';
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const DN=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const ld=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))||f}catch(e){return f}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let D=ld('togo_days',{}),PF=ld('togo_profile',{name:'',phone:'',rate:0});
let S=[],order=[],me=null,uid=null,work=false,leg=null,legAt=0,geo=null,follow=true,ready=false,mk=[],meMk=null,open=false,wasNear=false,page='home',wk=new Date(),selDay=ymd(new Date());
const today=()=>ymd(new Date());
const dayOf=s=>s.day||D[s.id]||today();
const row=r=>({id:r.id,lat:r.lat,lng:r.lng,name:r.customer_name,phone:r.phone,ord:r.order_details,addr:r.address,bld:r.building,apt:r.apartment,inv:r.invoice_no,amt:r.amount==null?null:+r.amount,cash:r.cash!==false,done:!!r.done,at:r.done_at,got:r.received==null?null:+r.received,rk:r.receipt_kept,day:r.delivery_date});
const active=()=>S.filter(s=>!s.done&&dayOf(s)<=today());
const doneToday=()=>S.filter(s=>s.done&&s.at&&ymd(new Date(s.at))===today());
const nextStop=()=>S.find(s=>s.id===order[0]);

/* ---------- map ---------- */
maplibregl.setRTLTextPlugin('https://cdn.jsdelivr.net/npm/@mapbox/mapbox-gl-rtl-text@0.3.0/dist/mapbox-gl-rtl-text.js',true);
const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[31.24,30.05],zoom:11,attributionControl:{compact:true}});
const empty={type:'FeatureCollection',features:[]};
const setLine=(id,c)=>{const s=map.getSource(id);if(s)s.setData(c&&c.length>1?{type:'Feature',geometry:{type:'LineString',coordinates:c}}:empty)};
map.on('load',()=>{
  map.getStyle().layers.forEach(l=>{if(l.type==='symbol'&&l.layout&&l.layout['text-field'])map.setLayoutProperty(l.id,'text-field',['coalesce',['get','name:ar'],['get','name']])});
  ['trip','leg'].forEach(i=>map.addSource(i,{type:'geojson',data:empty}));
  const lay={'line-cap':'round','line-join':'round'};
  map.addLayer({id:'trip',type:'line',source:'trip',layout:lay,paint:{'line-color':'#94a3b8','line-width':5,'line-opacity':.8}});
  map.addLayer({id:'leg-c',type:'line',source:'leg',layout:lay,paint:{'line-color':'#fff','line-width':12}});
  map.addLayer({id:'leg',type:'line',source:'leg',layout:lay,paint:{'line-color':'#f26a1b','line-width':7}});
  ready=true;render(true);
});
map.on('dragstart',e=>{if(e.originalEvent&&follow){follow=false;$('loc').classList.remove('on')}});
$('loc').onclick=()=>{if(!me)return toast('بانتظار إشارة الـ GPS');follow=true;$('loc').classList.add('on');cam()};
const cam=()=>{if(me)map.easeTo({center:[me.lng,me.lat],zoom:Math.max(map.getZoom(),15.5),padding:{bottom:Math.round(innerHeight*.3)},duration:800})};
async function fetchLeg(){
  const n=nextStop();legAt=Date.now();
  if(!n||!me){leg=null;setLine('leg',null);return draw()}
  try{const j=await(await fetch(`https://router.project-osrm.org/route/v1/driving/${me.lng},${me.lat};${n.lng},${n.lat}?overview=full&geometries=geojson`)).json();if(j.code==='Ok'){leg=j.routes[0];setLine('leg',leg.geometry.coordinates)}}catch(e){}
  draw();
}
function live(){
  if(!navigator.geolocation)return;
  navigator.geolocation.watchPosition(p=>{
    me={lat:p.coords.latitude,lng:p.coords.longitude};
    if(ready){if(!meMk){const e=document.createElement('div');e.className='me';meMk=new maplibregl.Marker({element:e}).setLngLat([me.lng,me.lat]).addTo(map)}meMk.setLngLat([me.lng,me.lat]);if(follow&&work&&page==='home')cam()}
    if(!leg||Date.now()-legAt>25000)fetchLeg();
    const n=nextStop(),near=!!(n&&hav(me,n)*1000<=NEAR);if(near!==wasNear){wasNear=near;draw()}

    const j=await(await fetch('https://router.project-osrm.org/trip/v1/driving/'+pts.map(p=>p.lng+','+p.lat).join(';')+'?source=first&roundtrip=false&overview=full&geometries=geojson')).json();

  }catch(e){let cur=me||P[0],left=[...P];order=[];while(left.length){left.sort((a,b)=>hav(cur,a)-hav(cur,b));cur=left.shift();order.push(cur.id)}legDur=[];let pv=me||P[0];order.forEach(id=>{const t=S.find(x=>x.id===id);legDur.push(hav(pv,t)*1.35/22*3600);pv=t})}

function initDrag(){
  const sh=$('sheet'),pk=$('peek'),dt=$('det'),off=()=>dt.offsetHeight,set=y=>sh.style.setProperty('--y',y+'px');

  pk.onpointerdown=e=>{y0=e.clientY;base=open?0:off();t0=performance.now();drag=false;ly=base};
  pk.onpointermove=e=>{

    if(!drag)return;
    const o=off();let y=base+dy;y=y<0?y/4:y>o?o+(y-o)/4:y;ly=y;set(y);
  };

function parse(t){t=decodeURIComponent(t||'');for(const x of[/[?&](?:q|ll|query|destination|center)=(-?\d+\.\d+)[, ]+(-?\d+\.\d+)/,/@(-?\d+\.\d+),(-?\d+\.\d+)/,/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/,/(-?\d{1,2}\.\d{3,})\s*,\s*(-?\d{1,3}\.\d{3,})/]){const m=t.match(x);if(m)return{lat:+m[1],lng:+m[2]}}return null}

function parseInvoice(raw){
  const L=raw.split(/\r?\n/).map(s=>s.trim()).filter(Boolean),T=L.join('\n'),o={};let m;

  if((m=T.match(/\bbu\w*ding\s*[:.]?\s*(\d+\w?)/i)))o.bld=m[1];
  if((m=T.match(/(?:apartment|apart\w*|apt|flat)\.?\s*[:.]?\s*(\w+)/i)))o.apt=m[1];
  const am=[...T.matchAll(/(\d{1,3}(?:,\d{3})*\.\d{2})\s*EGP/gi)].map(x=>parseFloat(x[1].replace(/,/g,'')));if(am.length)o.amt=Math.max(...am);

  const i=L.findIndex(l=>/shipping details/i.test(l)),junk=/invoice|tracking|^\d{2}\/\d{2}\/\d{2,4}$|^LS\d+|marmelade/i;
  let k=i>=0?i+1:Math.max(0,L.findIndex(l=>/marmelade/i.test(l))+1);const seg=[];
  for(;k<L.length;k++){const l=L[k];if(/^phone/i.test(l)||/^egypt$/i.test(l)||/payment details|^image|quantity/i.test(l))break;if(junk.test(l))continue;seg.push(l)}
  if(seg.length>1&&seg[0].toLowerCase()===seg[1].toLowerCase())seg.shift();
  if(seg[0]&&!/\d/.test(seg[0]))o.name=seg[0];if(seg.length>1)o.addr=seg.slice(o.name?1:0).join(', ');return o}
const loadTess=()=>new Promise((res,rej)=>{if(window.Tesseract)return res();const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)});
